version: "3"

## Load config from dotenv file
dotenv:
  - '{{ .ROOT_DIR }}/.env'

## Collection of config params
vars:
  ## Image config
  IMAGE_REPO: '{{ .IMAGE_REPO | default "ghcr.io/agntcy" }}'
  IMAGE_TAG: '{{ .IMAGE_TAG }}'

  ## Supported schema versions. Tests and local deployments use the default one,
  ## downloaded into .schemas/<ref>, unless SCHEMA_DIR points at another schema.
  SCHEMA_VERSIONS_FILE: '{{ .ROOT_DIR }}/schema-versions.json'
  SCHEMA_CACHE_DIR: '{{ .ROOT_DIR }}/.schemas'
  DEFAULT_SCHEMA:
    sh: jq -er '[.versions[] | select(.default)] | if length == 1 then .[0].schema else error("schema-versions.json needs exactly one default") end' '{{ .ROOT_DIR }}/schema-versions.json'
  DEFAULT_SCHEMA_REF:
    sh: jq -er '.versions[] | select(.default) | .ref' '{{ .ROOT_DIR }}/schema-versions.json'
  SCHEMA_DIR: '{{ .SCHEMA_DIR | default (printf "%s/.schemas/%s" .ROOT_DIR .DEFAULT_SCHEMA_REF) }}'

  ## Dependency config
  BIN_DIR: '{{ .ROOT_DIR }}/bin'
  HELM_VERSION: '3.16.3'
  HELM_BIN: '{{ .BIN_DIR }}/helm-{{.HELM_VERSION}}'
  KUBECTL_VERSION: '1.35.8'
  KUBECTL_BIN: '{{ .BIN_DIR }}/kubectl-{{.KUBECTL_VERSION}}'
  KIND_VERSION: '0.33.0'
  KIND_BIN: '{{ .BIN_DIR }}/kind-{{.KIND_VERSION}}'

## Set refresh interval for observable tasks like hot-reload
interval: 500ms

tasks:
  ##
  ## General
  ##
  default:
    cmds:
      - task -l

  build:
    desc: Build project artifacts
    cmds:
      - task: build:charts
      - task: build:server

  build:charts:
    desc: Build helm charts
    deps:
      - deps:helm
    vars:
      HELM_ALL_CHART_PATHS:
        sh: find . -name Chart.yaml -exec dirname {} \;
    cmds:
      - for: {var: HELM_ALL_CHART_PATHS}
        cmd: 'cd {{ .ITEM }} && {{ .HELM_BIN }} dependency update'

  build:server:
    desc: Build OASF server container image
    vars:
      BAKE_OPTS: '{{ .BAKE_OPTS | default (printf "--set *.platform=linux/%s" ARCH) }}'
    cmds:
      - docker buildx bake -f docker-bake.hcl oasf-server {{.BAKE_OPTS}}

  up:
    desc: Deploy the chart in an ephemeral kind cluster, serving the schema in SCHEMA_DIR from the node
    preconditions:
      - which jq
    deps:
      - deps:helm
      - deps:kubectl
      - deps:kind
      - task: schema:fetch
        vars: {REF: '{{ .DEFAULT_SCHEMA_REF }}'}
    vars:
      # Kind args
      KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME | default "test-oasf-cluster" }}'
      KIND_CREATE_OPTS: '{{ .KIND_CREATE_OPTS | default "" }}'
      KIND_CONFIG_PATH: '/tmp/{{.KIND_CLUSTER_NAME}}'
      KIND_NODE_IMAGE: '{{ .KIND_NODE_IMAGE | default "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0" }}'
      # Deployment args
      HELM_NAMESPACE: '{{ .HELM_NAMESPACE | default "default" }}'
      HELM_CHART_PATH: '{{ .ROOT_DIR }}/install/charts/oasf'
      HELM_VALUES_PATH: '{{ .HELM_VALUES_PATH | default (printf "%s/install/charts/oasf/values-test.yaml" .ROOT_DIR) }}'
      # Extra helm upgrade arguments, e.g. more -f files or --set flags.
      HELM_EXTRA_ARGS: '{{ .HELM_EXTRA_ARGS | default "" }}'
      # Wait for every Deployment to become ready.
      HELM_WAIT: '{{ .HELM_WAIT | default "true" }}'
      # Serve SCHEMA_DIR, mounted on the node at /schema, as the only schema
      # version. Set to false when HELM_EXTRA_ARGS provides schema.versions.
      DEV_SCHEMA: '{{ .DEV_SCHEMA | default "true" }}'
      # oasf-schema image tags to load into the cluster; pulled if not present.
      SCHEMA_IMAGE_TAGS: '{{ .SCHEMA_IMAGE_TAGS | default "" }}'
      SERVER_IMAGE: '{{ .IMAGE_REPO }}/oasf-server:{{ .IMAGE_TAG | default "latest" }}'
      LOG_LEVEL: '{{ .LOG_LEVEL | default "" }}'
      RELEASE_NAME: 'oasf'
    cmds:
      # Clean up previous deployment
      - task: down

      # Create volume config to share between Kind and host
      - |
        cat <<EOF > {{.KIND_CONFIG_PATH}}
        apiVersion: kind.x-k8s.io/v1alpha4
        kind: Cluster
        nodes:
          - role: control-plane
            image: {{ .KIND_NODE_IMAGE }}
            extraMounts:
              - hostPath: {{ .SCHEMA_DIR }}
                containerPath: /schema
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 30080
              hostPort: 8080
              protocol: TCP
        EOF

      # Create ephemeral cluster
      - '{{ .KIND_BIN }} create cluster {{ .KIND_CREATE_OPTS }} --name {{ .KIND_CLUSTER_NAME }} --config {{.KIND_CONFIG_PATH}}'
      - '{{ .KIND_BIN }} export kubeconfig --name {{ .KIND_CLUSTER_NAME }}'

      # Check cluster status
      - '{{ .KUBECTL_BIN }} cluster-info'

      # Load the server image and the schema images into kind.
      # Use a single-platform "docker save" + "kind load image-archive" rather than
      # "kind load docker-image": with Docker's containerd image store, saving a
      # multi-arch tag exports the full manifest list, and kind's --all-platforms
      # import fails on platform blobs not pulled locally (e.g. amd64 on arm64 hosts).
      - |
        set -eu
        archive=$(mktemp "${TMPDIR:-/tmp}/oasf-image.XXXXXX")
        trap 'rm -f "$archive"' EXIT
        load() {
          docker image inspect "$1" > /dev/null 2>&1 || docker pull --platform linux/{{ ARCH }} "$1"
          docker save --platform linux/{{ ARCH }} "$1" -o "$archive"
          {{ .KIND_BIN }} load image-archive "$archive" --name {{ .KIND_CLUSTER_NAME }}
        }
        load "{{ .SERVER_IMAGE }}"
        for tag in {{ .SCHEMA_IMAGE_TAGS }}; do
          load "{{ .IMAGE_REPO }}/oasf-schema:$tag"
        done

      # Deploy chart
      - |
        {{ .HELM_BIN }} upgrade {{.RELEASE_NAME}} \
          {{ .HELM_CHART_PATH }} \
          -f {{ .HELM_VALUES_PATH }} \
          --set image.repository="{{ .IMAGE_REPO }}/oasf-server" \
          --set image.tag="{{ .IMAGE_TAG | default "latest" }}" \
          --set schema.image.repository="{{ .IMAGE_REPO }}/oasf-schema" \
          {{- if eq .DEV_SCHEMA "true" }}
          --set-string "schema.versions[0].schema=$(jq -r .version '{{ .SCHEMA_DIR }}/version.json')" \
          --set "schema.versions[0].hostPath=/schema" \
          --set "schema.versions[0].default=true" \
          {{- end }}
          {{- if .LOG_LEVEL }}
          --set env.LOG_LEVEL={{.LOG_LEVEL}} \
          {{- end }}
          {{ .HELM_EXTRA_ARGS }} \
          --namespace {{ .HELM_NAMESPACE }} \
          --create-namespace \
          --install \
          {{- if eq .HELM_WAIT "true" }}
          --wait \
          --wait-for-jobs \
          {{- end }}
          --timeout "15m"

      # Wait for the ingress controller deployment to be available
      - |
        echo "Waiting for Deployment {{.RELEASE_NAME}}-ingress-controller in namespace {{.HELM_NAMESPACE}} to become available..."
        if ! {{ .KUBECTL_BIN }} wait deployment/{{.RELEASE_NAME}}-ingress-controller \
            --for=condition=Available \
            -n {{ .HELM_NAMESPACE }} \
            --timeout=300s; then
          echo "Error: Deployment {{.RELEASE_NAME}}-ingress-controller did not become available within 300 seconds."
          exit 1
        fi
        echo
        echo "Deployment is available at http://localhost:8080."

  reload:
    desc: Hot reload schema changes after deployment
    watch: true
    deps:
      - deps:kubectl
    sources:
      - '{{ .SCHEMA_DIR }}/**/*'
    vars:
      LABEL_SELECTOR: 'default-schema=true'
    preconditions:
      - '{{ .KUBECTL_BIN }} get po -l {{.LABEL_SELECTOR}}'
    cmds:
      - |
        POD_NAME=$({{ .KUBECTL_BIN }} get pods -l {{.LABEL_SELECTOR}} -o jsonpath="{.items[0].metadata.name}")
        {{.KUBECTL_BIN}} exec $POD_NAME -- ./bin/schema_server rpc "Schema.reload()"

      - echo "Reloaded schema! Use CTRL + C to exit."

  down:
    desc: Stop services and remove ephemeral kind cluster
    deps:
      - deps:kind
    vars:
      # Kind args
      KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME | default "test-oasf-cluster" }}'
    cmds:
      - '{{ .KIND_BIN }} delete cluster --name {{ .KIND_CLUSTER_NAME }}'

  test:
    desc: Run all test suites
    cmds:
      - task: test:server
      - task: test:server:extensions
      - task: test:charts

  test:charts:
    desc: Run the Helm chart unit tests (helm unittest, in Docker)
    preconditions:
      - which docker
    vars:
      HELM_UNITTEST_IMAGE: 'helmunittest/helm-unittest:3.19.0-1.0.3@sha256:4684b7cf1e1a20ce3ff2cbfcceda36566d862d6024fa23684955d10ef6d51ab1'
    cmds:
      # Run as the current user, so the plugin can write to the checkout.
      - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "{{ .ROOT_DIR }}/install/charts:/apps" {{ .HELM_UNITTEST_IMAGE }} oasf

  test:e2e:
    desc: Deploy every supported schema version, plus one with a missing schema image, to kind and check them (MOUNT=initContainer|imageVolume)
    preconditions:
      - which jq curl
    deps:
      - deps:kubectl
    vars:
      MOUNT: '{{ .MOUNT | default "initContainer" }}'
      MISSING_SCHEMA: 9.9.9
      E2E_VALUES_PATH: '/tmp/oasf-e2e-values.json'
      SCHEMA_TAGS:
        sh: jq -r '[.versions[].tag] | join(" ")' '{{ .SCHEMA_VERSIONS_FILE }}'
    cmds:
      - defer: {task: down}
      # Every supported version from schema-versions.json, plus one whose schema
      # image does not exist: it must stay unready without affecting the others.
      - |
        jq --arg mount '{{ .MOUNT }}' --arg missing '{{ .MISSING_SCHEMA }}' '{schema: {
            mount: $mount,
            versions: ([.versions[] | {schema, tag, default: (.default // false)}]
              + [{schema: $missing, tag: "v\($missing)-missing"}])
          }}' '{{ .SCHEMA_VERSIONS_FILE }}' > '{{ .E2E_VALUES_PATH }}'
        cat '{{ .E2E_VALUES_PATH }}'
      - task: up
        vars:
          DEV_SCHEMA: "false"
          HELM_WAIT: "false"
          HELM_EXTRA_ARGS: '-f {{ .E2E_VALUES_PATH }}'
          SCHEMA_IMAGE_TAGS: '{{ .SCHEMA_TAGS }}'
      - |
        set -eu
        for schema in $(jq -r '.versions[].schema' '{{ .SCHEMA_VERSIONS_FILE }}'); do
          {{ .KUBECTL_BIN }} rollout status "deployment/oasf-$(echo "$schema" | tr . -)" --timeout=300s
        done
      - cmd: |
          KUBECTL='{{ .KUBECTL_BIN }}' {{ .ROOT_DIR }}/scripts/e2e-check.sh http://localhost:8080 \
            '{{ .SCHEMA_VERSIONS_FILE }}' '{{ .MISSING_SCHEMA }}'

  test:image:
    desc: Verify the server image refuses to start without a schema and serves a mounted one
    preconditions:
      - which docker curl
    deps:
      - task: schema:fetch
        vars: {REF: '{{ .DEFAULT_SCHEMA_REF }}'}
    vars:
      IMAGE: '{{ .IMAGE_REPO }}/oasf-server:{{ .IMAGE_TAG | default "latest" }}'
      PORT: '{{ .PORT | default "18080" }}'
    cmds:
      - cmd: |
          set -eu
          echo "Starting {{ .IMAGE }} without a schema..."
          status=0
          output=$(timeout 60 docker run --rm {{ .IMAGE }} 2>&1) || status=$?
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "Error: expected the server to exit with an error, got status $status"
            echo "$output"
            exit 1
          fi
          if ! echo "$output" | grep -q "No schema found in SCHEMA_DIR=/app/schema"; then
            echo "Error: expected a clear error about the missing schema, got:"
            echo "$output"
            exit 1
          fi
          echo "OK: exited with status $status and reported the missing schema."
      - cmd: |
          set -eu
          echo "Starting {{ .IMAGE }} with {{ .SCHEMA_DIR }} mounted..."
          container=$(docker run --detach --rm -p {{ .PORT }}:8080 \
            -v "{{ .SCHEMA_DIR }}:/app/schema:ro" {{ .IMAGE }})
          trap 'docker rm --force "$container" > /dev/null' EXIT
          expected=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "{{ .SCHEMA_DIR }}/version.json")
          version=$(curl --retry 20 --retry-delay 2 --retry-all-errors --fail --silent \
            http://localhost:{{ .PORT }}/api/version)
          if ! echo "$version" | grep -q "\"$expected\""; then
            echo "Error: expected schema version $expected, got: $version"
            docker logs "$container"
            exit 1
          fi
          echo "OK: serving schema $expected."

  test:smoke:
    desc: Boot the server image with one supported schema version (SCHEMA, default the default version) and smoke-test it
    preconditions:
      - which docker curl jq
    vars:
      SCHEMA: '{{ .SCHEMA | default .DEFAULT_SCHEMA }}'
      REF:
        sh: jq -er --arg schema '{{ .SCHEMA | default .DEFAULT_SCHEMA }}' '.versions[] | select(.schema == $schema) | .ref' '{{ .SCHEMA_VERSIONS_FILE }}'
      IMAGE: '{{ .IMAGE_REPO }}/oasf-server:{{ .IMAGE_TAG | default "latest" }}'
      PORT: '{{ .PORT | default "18081" }}'
    deps:
      - task: schema:fetch
        vars: {REF: '{{ .REF }}'}
    cmds:
      - cmd: |
          set -eu
          container=$(docker run --detach --rm -p {{ .PORT }}:8080 \
            -v "{{ .SCHEMA_CACHE_DIR }}/{{ .REF }}:/app/schema:ro" {{ .IMAGE }})
          trap 'docker rm --force "$container" > /dev/null' EXIT
          if ! {{ .ROOT_DIR }}/scripts/smoke-test.sh http://localhost:{{ .PORT }} {{ .SCHEMA }}; then
            docker logs "$container" | tail -n 50
            exit 1
          fi

  test:smoke:all:
    desc: Run test:smoke for every supported schema version
    vars:
      SCHEMAS:
        sh: jq -r '.versions[].schema' '{{ .SCHEMA_VERSIONS_FILE }}'
    cmds:
      - for: {var: SCHEMAS}
        task: test:smoke
        vars: {SCHEMA: '{{ .ITEM }}'}

  schema:fetch:
    desc: Download the schema of an agntcy/oasf release tag (REF) into .schemas/<ref>
    requires:
      vars: [REF]
    status:
      - test -f '{{ .SCHEMA_CACHE_DIR }}/{{ .REF }}/version.json'
    cmds:
      - cmd: |
          set -eu
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error --location \
            "https://codeload.github.com/agntcy/oasf/tar.gz/refs/tags/{{ .REF }}" | tar -xz -C "$tmp"
          mkdir -p '{{ .SCHEMA_CACHE_DIR }}'
          rm -rf '{{ .SCHEMA_CACHE_DIR }}/{{ .REF }}'
          mv "$tmp"/*/schema '{{ .SCHEMA_CACHE_DIR }}/{{ .REF }}'
          echo "Fetched the {{ .REF }} schema into {{ .SCHEMA_CACHE_DIR }}/{{ .REF }}"

  test:server:
    desc: Test server code (includes schema integrity, API, and unit tests)
    preconditions:
      - which mix
    deps:
      - task: schema:fetch
        vars: {REF: '{{ .DEFAULT_SCHEMA_REF }}'}
    dir: '{{ .ROOT_DIR }}'
    env:
      SCHEMA_DIR: '{{ .SCHEMA_DIR }}'
    cmds:
      - cmd: echo "Running OASF server test suite..."
      - cmd: mix test

  test:coverage:
    desc: Write a coverage report of the test suite to cover/excoveralls.json
    preconditions:
      - which mix
    deps:
      - task: schema:fetch
        vars: {REF: '{{ .DEFAULT_SCHEMA_REF }}'}
    dir: '{{ .ROOT_DIR }}'
    env:
      SCHEMA_DIR: '{{ .SCHEMA_DIR }}'
    cmds:
      - mix coveralls.json

  test:server:extensions:
    desc: Test server code with the example extension loaded
    preconditions:
      - which mix
    deps:
      - task: schema:fetch
        vars: {REF: '{{ .DEFAULT_SCHEMA_REF }}'}
    dir: '{{ .ROOT_DIR }}'
    env:
      SCHEMA_DIR: '{{ .SCHEMA_DIR }}'
      SCHEMA_EXTENSION: test/extensions
    cmds:
      - cmd: echo "Running OASF server test suite with the example extension loaded..."
      - cmd: mix test

  lint:
    desc: Run all linters
    cmds:
      - task: lint:charts

  lint:charts:
    desc: Run Helm linters
    deps:
      - deps:helm
    vars:
      HELM_ALL_CHART_PATHS:
        sh: find . -name Chart.yaml -exec dirname {} \;
    cmds:
      - for: {var: HELM_ALL_CHART_PATHS}
        # A chart without schema versions fails to render, so lint it with each
        # set of example values under ci/.
        cmd: |
          set -eu
          cd {{ .ITEM }}
          for values in ci/*-values.yaml; do
            {{ .HELM_BIN }} lint . --strict -f "$values"
          done

  fmt:
    desc: Run formatters
    cmds:
      - task: fmt:elixir

  fmt:elixir:
    desc: Run the Elixir formatter
    dir: '{{ .ROOT_DIR }}'
    cmds:
      - |
        if ! command -v mix >/dev/null 2>&1; then
          echo "mix not found, skipping Elixir formatting."
          exit 0
        fi
        mix format

  ##
  ## Dependencies
  ##
  deps:
    desc: Install project dependencies
    cmds:
      - task: deps:helm
      - task: deps:kubectl
      - task: deps:kind

  deps:bin-dir:
    desc: Create bin directory
    internal: true
    run: once
    cmd: mkdir -p {{.BIN_DIR}}
    status:
      - test -d {{.BIN_DIR}}

  deps:helm:
    desc: Ensure supported Helm version is installed
    internal: true
    deps:
      - deps:bin-dir
    preconditions:
      - which curl
      - which tar
    cmds:
      - cmd: echo "Downloading Helm v{{.HELM_VERSION}}..."
      - cmd: curl -sSfL 'https://get.helm.sh/helm-v{{.HELM_VERSION}}-{{OS}}-{{ARCH}}.tar.gz' --output - | tar xzvOf - '{{OS}}-{{ARCH}}/helm' > {{.HELM_BIN}}
      - cmd: chmod +x {{.HELM_BIN}}
    status:
      - test -x {{.HELM_BIN}}

  deps:kubectl:
    desc: Ensure supported kubectl version is installed
    internal: true
    deps:
      - deps:bin-dir
    preconditions:
      - which curl
    cmds:
      - cmd: echo "Downloading Kubectl v{{.KUBECTL_VERSION}}..."
      - cmd: curl -L "https://dl.k8s.io/release/v{{.KUBECTL_VERSION}}/bin/{{OS}}/{{ARCH}}/kubectl" -o {{.KUBECTL_BIN}}
      - cmd: chmod +x {{.KUBECTL_BIN}}
    status:
      - test -x {{.KUBECTL_BIN}}

  deps:kind:
    desc: Ensure supported kind version is installed
    internal: true
    deps:
      - deps:bin-dir
    preconditions:
      - which go
    cmds:
      - cmd: echo "Downloading Kind v{{.KIND_VERSION}}..."
      - cmd: GOBIN={{.BIN_DIR}} go install sigs.k8s.io/kind@v{{.KIND_VERSION}}
      - cmd: mv {{.BIN_DIR}}/kind {{.KIND_BIN}}
    status:
      - test -x {{.KIND_BIN}}
