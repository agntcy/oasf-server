name: Container Image Cleanup

on:
  workflow_dispatch:
    inputs:
      image-tags:
        required: false
        type: string
        description: Which image tags to remove (glob patterns, ! excludes). Releases (v*), main and latest are always kept.
        default: "pr*"
      dry-run:
        required: false
        type: boolean
        description: Prints output showing images which would be deleted but does not actually delete any images.
        default: true

env:
  repo: agntcy
  images: oasf-server

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Cleanup stale container images
    permissions:
      # Needed to delete stale container images from GHCR.
      packages: write
    steps:
      - name: Remove stale images
        uses: snok/container-retention-policy@4f22ef80902ad409ed55a99dc5133cc1250a0d03 # v3.0.0
        with:
          # Who should delete images
          account: ${{ env.repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # How to delete images
          dry-run: ${{ inputs.dry-run }}
          cut-off: 1s
          timestamp-to-use: created_at
          # Which images should be deleted
          image-names: ${{ env.images }}
          # Only PR and commit tags are pruned. The exclusions are appended to
          # whatever is requested, so releases, main and latest always stay.
          image-tags: ${{ inputs.image-tags }} !v* !main !latest
          # Images are multi-platform: their platform manifests are untagged
          # package versions, so selecting untagged ones too would delete the
          # manifests behind the tags kept above.
          tag-selection: tagged
