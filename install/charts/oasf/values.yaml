# Default values for the oasf chart.

localDeploy: false
nameOverride: ""
fullnameOverride: ""

# oasf-server image. Every schema version runs this image unless its entry
# overrides it with server.tag.
image:
  repository: ghcr.io/agntcy/oasf-server
  # Defaults to the chart's appVersion.
  tag: ""
  # Optional digest to pin the image, e.g. sha256:...
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Schema versions to serve. Each version runs its own Deployment and Service,
# named <fullname>-<schema with dots replaced by dashes>, and is served under
# /<schema>, /api/<schema>, /schema/<schema> and /sample/<schema>. The default
# version is also served without the version segment.
schema:
  image:
    repository: ghcr.io/agntcy/oasf-schema
    pullPolicy: IfNotPresent

  # How the schema image is mounted into the server:
  # - initContainer: an init container copies /schema into an emptyDir. Works on
  #   every cluster.
  # - imageVolume: the image is mounted as an image volume. Needs Kubernetes 1.35
  #   or later, or the ImageVolume feature gate; rendering fails below 1.35.
  mount: initContainer
  imageVolume:
    # Allow imageVolume below Kubernetes 1.35, for clusters that enabled the
    # ImageVolume feature gate themselves. Without the gate the pods start
    # without a schema.
    skipVersionCheck: false
  initContainer:
    resources: {}

  versions: []
    # - schema: 1.1.0   # URL segment, resource names and oasf-schema image tag
    #   digest: ""      # optional, pins the schema image
    #   default: true   # at most one; without one, the first version is the default
    # - schema: 1.0.0
    #   tag: ""         # optional, overrides the oasf-schema image tag
    #   server:         # optional per-version server image override
    #     tag: v2.0.1
    #     digest: ""
    # - schema: 1.2.0-dev
    #   hostPath: /schema  # local development: mount a schema directory from the node

config:
  server_port: 8080

# service exposes gRPC server api
service:
  type: ClusterIP
  port: 8080

serviceAccount:
  # Specifies whether a service account should be created.
  create: false
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Extra volumes and mounts for the server container. The schema is mounted at
# /app/schema and an emptyDir at /tmp.
volumes: []
volumeMounts: []

# Additional environment variables
env: {}
  # GA_TRACKING_ID: "G-XXXXXXXX-X"
  # LOG_LEVEL: warning

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Applies to the server container and the schema init container.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: ""
  annotationMode: both # community | f5 | both
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  service: {} # Service configuration for the ingress controller
    # type: ClusterIP

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  replicaCount: 1
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
