# Values for local kind deployments (task up, task test:e2e). The schema
# versions are set on the command line: task up serves SCHEMA_DIR from the
# node, task test:e2e every version in schema-versions.json.

localDeploy: true

image:
  repository: ghcr.io/agntcy/oasf-server
  tag: latest
  pullPolicy: IfNotPresent

schema:
  image:
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: localhost
  tls: []
  service:
    type: NodePort

service:
  type: NodePort

env:
  HOST: localhost
  URL_PORT: 8080
  LOG_LEVEL: info
