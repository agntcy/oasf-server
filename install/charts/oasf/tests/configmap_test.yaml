suite: schema versions ConfigMap
templates:
  - schema-versions-configmap.yaml
release:
  name: oasf
tests:
  - it: lists every version with its server version, marking the first as default when none is
    set:
      image.tag: v2.0.0
      schema.versions:
        - {schema: 1.1.0, tag: v1.1.3}
        - {schema: 1.0.0, tag: v1.0.4, server: {tag: v2.0.1}, api: v0.6.0}
    asserts:
      - equal:
          path: metadata.name
          value: oasf-schema-versions
      - equal:
          path: data.versions
          value: '{"versions":[{"default":true,"schema_version":"1.1.0","server_version":"v2.0.0"},{"api_version":"v0.6.0","default":false,"schema_version":"1.0.0","server_version":"v2.0.1"}]}'
