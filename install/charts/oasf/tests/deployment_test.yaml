suite: deployment
templates:
  - deployment.yaml
release:
  name: oasf
values:
  - values/versions.yaml
tests:
  - it: renders one Deployment per schema version, named as in chart v1
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: oasf-1-1-0
        documentSelector: {path: metadata.labels.schema-version, value: "1.1.0"}
      - equal:
          path: metadata.name
          value: oasf-1-0-0
        documentSelector: {path: metadata.labels.schema-version, value: "1.0.0"}

  - it: labels only the default version as default
    asserts:
      - equal:
          path: metadata.labels.default-schema
          value: "true"
        documentSelector: {path: metadata.name, value: oasf-1-1-0}
      - notExists:
          path: metadata.labels.default-schema
        documentSelector: {path: metadata.name, value: oasf-1-0-0}

  - it: runs the chart's appVersion and serves each version under its own path
    documentSelector: {path: metadata.name, value: oasf-1-0-0}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/agntcy/oasf-server:v2.0.0
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SCHEMA_PATH, value: /1.0.0}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SCHEMA_DIR, value: /app/schema}

  - it: copies the schema image into an emptyDir by default
    documentSelector: {path: metadata.name, value: oasf-1-0-0}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/agntcy/oasf-schema:v1.0.4
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [cp, -R, /schema/., /work/]
      - contains:
          path: spec.template.spec.volumes
          content: {name: schema, emptyDir: {}}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: schema, mountPath: /app/schema, readOnly: true}

  - it: pins images by digest when one is given
    set:
      image.digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      schema.versions:
        - {schema: 1.1.0, tag: v1.1.3, default: true}
        - {schema: 1.0.0, tag: v1.0.4, digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"}
    documentSelector: {path: metadata.name, value: oasf-1-0-0}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/agntcy/oasf-server:v2.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/agntcy/oasf-schema:v1.0.4@sha256:2222222222222222222222222222222222222222222222222222222222222222

  - it: lets a version override the server image
    set:
      image.tag: v2.0.0
      image.digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      schema.versions:
        - {schema: 1.1.0, tag: v1.1.3, default: true}
        - {schema: 1.0.0, tag: v1.0.4, server: {tag: v2.0.1}}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/agntcy/oasf-server:v2.0.1
        documentSelector: {path: metadata.name, value: oasf-1-0-0}
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/agntcy/oasf-server:v2.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
        documentSelector: {path: metadata.name, value: oasf-1-1-0}

  - it: mounts the schema image as an image volume on Kubernetes 1.35
    capabilities:
      majorVersion: 1
      minorVersion: 35
    set:
      schema.mount: imageVolume
    documentSelector: {path: metadata.name, value: oasf-1-0-0}
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - contains:
          path: spec.template.spec.volumes
          content:
            name: schema
            image: {reference: ghcr.io/agntcy/oasf-schema:v1.0.4, pullPolicy: IfNotPresent}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: schema, mountPath: /app/schema, readOnly: true, subPath: schema}

  - it: refuses image volumes below Kubernetes 1.35
    capabilities:
      majorVersion: 1
      minorVersion: 34
    set:
      schema.mount: imageVolume
    asserts:
      - failedTemplate:
          errorPattern: schema.mount=imageVolume needs Kubernetes 1.35 or later

  - it: allows image volumes below 1.35 when the version check is skipped
    capabilities:
      majorVersion: 1
      minorVersion: 34
    set:
      schema.mount: imageVolume
      schema.imageVolume.skipVersionCheck: true
    asserts:
      - hasDocuments:
          count: 2

  - it: mounts a node directory in local development mode
    set:
      schema.versions:
        - schema: 1.2.0-dev
          hostPath: /schema
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - contains:
          path: spec.template.spec.volumes
          content: {name: schema, hostPath: {path: /schema, type: Directory}}
      - equal:
          path: metadata.labels.default-schema
          value: "true"

  - it: runs as non-root with a read-only root filesystem and a writable /tmp
    documentSelector: {path: metadata.name, value: oasf-1-1-0}
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: tmp, mountPath: /tmp}
