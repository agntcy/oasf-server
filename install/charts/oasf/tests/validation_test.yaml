suite: schema.versions validation
templates:
  - deployment.yaml
tests:
  - it: fails without schema versions
    asserts:
      - failedTemplate:
          errorPattern: schema.versions must list at least one schema version

  - it: fails on a duplicated version
    set:
      schema.versions:
        - {schema: 1.1.0, tag: v1.1.3}
        - {schema: 1.1.0, tag: v1.1.2}
    asserts:
      - failedTemplate:
          errorPattern: schema.versions lists 1.1.0 more than once

  - it: fails on more than one default
    set:
      schema.versions:
        - {schema: 1.1.0, tag: v1.1.3, default: true}
        - {schema: 1.0.0, tag: v1.0.4, default: true}
    asserts:
      - failedTemplate:
          errorPattern: only one schema.versions entry can be the default, got 1.1.0, 1.0.0

  - it: fails on an unknown mount method
    set:
      schema.mount: copy
      schema.versions:
        - {schema: 1.1.0, tag: v1.1.3}
    asserts:
      - failedTemplate: {}

  - it: rejects a version with neither a tag nor a hostPath
    set:
      schema.versions:
        - {schema: 1.1.0}
    asserts:
      - failedTemplate: {}

  - it: rejects the chart v1 image.versions list
    set:
      image.versions:
        - {server: v1.1.3, schema: 1.1.0}
      schema.versions:
        - {schema: 1.1.0, tag: v1.1.3}
    asserts:
      - failedTemplate: {}
