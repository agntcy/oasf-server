{{- range $version := .Values.schema.versions }}
---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.version.fullname" (dict "root" $ "version" $version) }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
    schema-version: {{ toString $version.schema | quote }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chart.selectorLabels" $ | nindent 4 }}
    schema-version: {{ toString $version.schema | quote }}
{{- end }}
